services:
  - type: web
    name: public-workforce-console
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm admin:serve
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: '22.23.2'
      - key: NODE_EXTRA_CA_CERTS
        value: /opt/render/project/src/config/certificates/supabase-prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
  - type: worker
    name: public-workforce-collector
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm --filter @public-workforce/crawler-worker exec playwright install --with-deps chromium && pnpm build
    startCommand: pnpm collection:daemon
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: '22.23.2'
      - key: NODE_EXTRA_CA_CERTS
        value: /opt/render/project/src/config/certificates/supabase-prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: CRAWLER_USER_AGENT
        sync: false
      - key: CRAWLER_CONTACT_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: '5000'
      - key: WORKER_CONCURRENCY
        value: '1'
      - key: STARTUP_LEGACY_CONTACT_IMPORT_ARTIFACT_ID
        sync: false
      - key: STARTUP_COLLECTION_PROJECT_ID
        sync: false
      - key: STARTUP_COLLECTION_APPROVED_BY
        sync: false
      - key: STARTUP_COLLECTION_APPROVAL_NOTE
        sync: false
      - key: STARTUP_COLLECTION_EXPIRES_AT
        sync: false
      - key: CRAWLER_RENDER_BROWSER_DOMAINS
        sync: false
      - key: CRAWLER_RENDER_BROWSER_MAX_SUBRESOURCES
        value: '50'
      - key: CRAWLER_RENDER_BROWSER_DEADLINE_MS
        value: '20000'
      - key: LOG_LEVEL
        value: info
